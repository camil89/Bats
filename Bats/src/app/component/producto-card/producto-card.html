<div class="card h-100 shadow border-0 overflow-hidden hover-effect">
  <img [src]="item.imagenUrl" class="card-img-top" [alt]="item.nombre" style="height: 200px; object-fit: cover;">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title fw-bold text-dark mb-0">{{ item.nombre }}</h5>
      <span class="badge bg-secondary">#0{{ item.id }}</span>
    </div>
    <h6 class="card-subtitle mb-2 text-muted fst-italic fs-7">{{ item.especie }}</h6>
    <p class="card-text text-secondary flex-grow-1 fs-6">{{ item.descripcion }}</p>
    
    @if (item.esFavorito) {
      <button class="btn btn-outline-danger fw-bold mt-3 w-100" (click)="onToggleFavorito()">
        ❌ Quitar de Favoritos
      </button>
    } @else {
      <button class="btn btn-outline-warning text-dark fw-bold mt-3 w-100" (click)="onToggleFavorito()">
        ❤️ Marcar como Favorito
      </button>
    }
  </div>
</div>
